name: Docs

# Publishes wiki/ to the repository's GitHub wiki when a release finishes.
# The wiki is an ordinary git repository (<repo>.wiki.git), so this is a
# checkout, a build of the screenshots, a mirror of the files and a push,
# with no third-party action.
#
# Triggers:
# - The Release workflow completes.  The job runs only when that run
#   succeeded, whether a tag push or a manual run started it.  The tag comes
#   from the run's title, which release.yml sets to "Release <tag>" for both
#   triggers, and the manual is published as committed at that tag.  A tag
#   with a pre-release suffix, v0.1.0-rc1, publishes nothing.
# - A manual run.  The optional input names an existing v* tag; without it,
#   the newest v* tag without a pre-release suffix (such as -rc1) is used.
#   Use this to re-publish after the first
#   wiki page has been created.
#
# The wiki must exist before the first run: create one page by hand in the
# repository's Wiki tab, otherwise the clone below fails with 404.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing v* tag to publish (default: the newest v* tag without a pre-release suffix)"
        required: false

concurrency:
  group: docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # The user manual lives in wiki/ in this repository and is mirrored to the
  # GitHub wiki from here, on release, so that what the wiki describes is a
  # firmware you can actually download rather than whatever main happened to
  # contain that afternoon.
  #
  # The screenshots are not committed. They are re-rendered here from the host
  # test suite, which draws them with the real UI code -- the same guarantee the
  # README's previews carry, extended to the manual. A page referencing a screen
  # nobody captured fails the link check below rather than publishing a broken
  # image.
  wiki:
    name: Publish wiki
    runs-on: ubuntu-latest
    # A pre-release, whose tag carries a suffix such as -rc1, publishes no
    # manual: the run's title is "Release <tag>", and a hyphen in it is that
    # suffix.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       !contains(github.event.workflow_run.display_title, '-'))
    steps:
      # Resolves the tag and the commit to publish.  Everything reaches the
      # script through the environment, never interpolated into it: a tag or
      # a branch name containing shell metacharacters would otherwise run.
      - id: pick
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          set -eu
          if [ "$EVENT" = workflow_run ]; then
            # release.yml titles every run "Release <tag>".
            tag="${RUN_TITLE#Release }"
          else
            tag="$INPUT_TAG"
            if [ -z "$tag" ]; then
              # The newest tag without a pre-release suffix: v2.4, not v2.4-rc1.
              tag=$(git ls-remote --tags --refs --sort=-v:refname \
                      "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" 'v*' \
                    | sed 's|.*refs/tags/||' | grep -v -- '-' | sed -n 1p || true)
            fi
          fi
          ref="refs/tags/$tag"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9A-Za-z._-]+$'; then
            echo "::error::'$tag' is not a v-prefixed tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "publishing the manual for $tag"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.pick.outputs.ref }}

      - name: Render the screens from the host suite
        run: |
          make -C test run
          python3 tools/make_previews.py --wiki

      # Cheap, and it catches the two failures that are invisible until someone
      # is reading the published page: a link to a page that was renamed, and an
      # image that no test captures any more.
      - name: Check every internal link and image resolves
        run: python3 tools/check_wiki.py

      - name: Push to the wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pick.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          # A wiki that has never had a page created has no .wiki.git to clone,
          # and the clone fails with a bare "repository not found" that reads
          # like a permissions problem. Say what it actually is.
          if ! git clone --depth 1 \
                 "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.wiki.git" wiki-repo 2>clone.log; then
            cat clone.log
            echo "::error::Could not clone ${REPO}.wiki.git. If this is the first \
          run, create one page in the repository's Wiki tab by hand -- GitHub does \
          not create the wiki repository until a page exists."
            exit 1
          fi

          # Mirror rather than merge: wiki/ in the source tree is the only
          # author. Anything edited in the browser is meant to lose, and the
          # footer on every page says so.
          find wiki-repo -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} +
          cp -r wiki/. wiki-repo/

          cd wiki-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already matches ${TAG}; nothing to push"
            exit 0
          fi
          git commit -m "docs: publish the manual for ${TAG}"
          git push
          echo "wiki updated for ${TAG}"

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  PICO_SDK_VERSION: "2.1.1"

jobs:
  # Builds the firmware for the RP2350-Touch-LCD-2.8 with the native Pico SDK.
  # Dependency versions are pinned in CMakeLists.txt, so this builds identically
  # here and locally.
  firmware:
    name: Firmware (touch-lcd-2.8)
    # A fixed image, not ubuntu-latest: the build compiles the Pico SDK's
    # pioasm with the runner's host compiler, and the pioasm of SDK 2.1.1
    # does not build with GCC 15, whose library headers no longer include
    # <cstdint> for it. Ubuntu 24.04's host compiler is GCC 13.
    runs-on: ubuntu-24.04
    env:
      SLUG: touch-lcd-2.8
    steps:
      - uses: actions/checkout@v6

      - name: Install the ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache the SDK and fetched dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/pico-sdk
            build/_deps
          # restore-keys means an edit to CMakeLists.txt -- including a
          # comment -- reuses the previous entry instead of forcing a fresh
          # clone and re-fetch of the ~200 MB SDK on every job.
          key: picosdk-${{ env.PICO_SDK_VERSION }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            picosdk-${{ env.PICO_SDK_VERSION }}-

      # tinyusb is needed for stdio over USB CDC; without the submodule the SDK
      # silently builds without USB support and SERIAL_TELEMETRY goes nowhere.
      - name: Fetch the Pico SDK
        run: |
          if [ ! -d ~/pico-sdk/.git ]; then
            git clone --depth 1 --branch "$PICO_SDK_VERSION" \
              https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
            git -C ~/pico-sdk submodule update --init --depth 1 lib/tinyusb
          fi

      - name: Build
        run: |
          # Set here rather than in env:, because GitHub does not expand ~ in
          # env values -- CMake would receive the literal string "~/pico-sdk"
          # and report the SDK missing.
          export PICO_SDK_PATH="$HOME/pico-sdk"
          # STRICT=ON puts -Werror on this project's own sources, and only
          # those. Until it existed the cross build had no -Werror at all, so a
          # warning only arm-none-eabi produces -- the newlib %lu/uint32_t class
          # of thing this firmware has already been bitten by -- was printed
          # here and ignored. The permutation job below cannot catch those: it
          # is a different compiler.
          # CMAKE_BUILD_TYPE=Release is explicit even though CMakeLists.txt
          # defaults an empty build type to Release: the flag documents the
          # intent, and the DWARF compile-unit check below depends on debug
          # info being present (the SDK's PICO_DEBUG_INFO_IN_RELEASE keeps -g
          # in Release builds).
          cmake -B build -G Ninja -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350-arm-s \
                -DCMAKE_BUILD_TYPE=Release -DSTRICT=ON .
          ninja -C build MiniRcBench
          # sdtest is deliberately NOT built here. It is a bench bring-up
          # tool, never released, and it is not worth a red firmware job: it
          # builds locally (a plain `ninja` produces it, as README says), it is
          # not this pipeline's job to prove it.
          arm-none-eabi-size "build/MiniRcBench-$SLUG.elf"

      # The host job's PIO emulators assemble src/sdio/sd_pio.pio and
      # src/backlight.pio with their own assembler. This build has the SDK's pioasm, so the emulator's
      # assembler is held to it here: every instruction word, wrap point,
      # public label and side-set setting has to match.
      - name: The PIO emulator assembles as pioasm does
        run: |
          python3 test/pio_sdio_emu.py --asm-only \
                  --pioasm build/pioasm-install/pioasm/pioasm
          python3 test/pio_backlight_emu.py \
                  --pioasm build/pioasm-install/pioasm/pioasm

      # The host job's KST and Hitec line models run the words in
      # test/rcbench/fixtures/*_line_words.txt. The firmware runs pioasm's
      # assembly of the same .pio files, so the fixtures are held to it here.
      - name: The line fixtures are pioasm's words
        run: |
          pioasm=build/pioasm-install/pioasm/pioasm
          for p in kst hitec; do
            "$pioasm" -o hex "lib/rcbench/protocols/$p/rp2350/${p}_line.pio" "build/${p}_line.hex"
            diff -u "test/rcbench/fixtures/${p}_line_words.txt" "build/${p}_line.hex"
          done

      # The Hitec job runs on core1, whose stack is 2 KB
      # (PICO_CORE1_STACK_SIZE). src/hitec.cmake builds the job, its line
      # port and driver, the session, the register model and the supply with
      # -fcallgraph-info=su at the Release flags. The deepest chain from the
      # job's three entry points may take 1792 bytes, which leaves 256 bytes
      # for loop1() and core1JobPoll() above them. A frame of no fixed size
      # or a recursion fails at once.
      - name: Hitec job stack on core1
        run: |
          mapfile -t ci < <(find build -name 'hitec_*.ci' -o -name 'servo_supply.cpp.ci')
          printf '%s\n' "${ci[@]}"
          [ "${#ci[@]}" -eq 9 ] || {
            echo "::error::expected 9 call-graph files, found ${#ci[@]}"; exit 1; }
          python3 tools/stack_depth.py --limit 1792 \
            --root hitecJobStep --root hitecJobRelease --root hitecJobBind "${ci[@]}"

      # A ceiling, not a printout. The framebuffer alone is 150 kB of the
      # RP2350's 520 kB, and a regression that doubles a buffer otherwise passes
      # CI and fails on the bench. Generous enough not to be a nuisance; tighten
      # it when the numbers settle.
      - name: Size budget
        run: |
          read -r text data bss _ <<<"$(arm-none-eabi-size \
            "build/MiniRcBench-$SLUG.elf" | tail -1)"
          flash=$((text + data))
          ram=$((data + bss))
          echo "flash=${flash}B ram=${ram}B"
          # 1 MB of the 4 MB the linker script declares. The settings sector is
          # the last 4 kB of the full 4 MB (PICO_FLASH_SIZE_BYTES -
          # FLASH_SECTOR_SIZE -- see settings_flash.cpp), so a 1 MB image can
          # never collide with it; this ceiling is purely a growth budget.
          [ "$flash" -lt 1048576 ] || { echo "::error::flash budget exceeded"; exit 1; }
          [ "$ram"   -lt 400000  ] || { echo "::error::RAM budget exceeded"; exit 1; }

      # The SD library's SDIO driver derives from GPL-3.0 code, so the build
      # compiles none of it (CMakeLists.txt rebuilds the library target from
      # its other files) and links the MIT driver in src/sdio/ instead. This
      # holds the image to that, from the DWARF compile units: none may come
      # from the library's SDIO, ZuluSCSI or SdFat directories, nor from
      # dma_interrupts.c, which served only that driver.
      - name: No file of the library's SDIO driver is in the image
        run: |
          set -eo pipefail
          elf="build/MiniRcBench-$SLUG.elf"
          units=$(arm-none-eabi-readelf --debug-dump=info "$elf" \
                    | grep -A8 DW_TAG_compile_unit | grep DW_AT_name || true)
          if printf '%s\n' "$units" \
               | grep -E '/sd_driver/SDIO/|ZuluSCSI|SdFat|rp2040_sdio|dma_interrupts'; then
            echo "::error::a file of the library's SDIO driver is in the image"
            exit 1
          fi
          grep -q 'src/sdio/sd_pio\.c' <<< "$units" || {
            echo "::error::src/sdio/sd_pio.c is not in the image"; exit 1; }
          echo "SDIO driver: src/sdio/ only"

      # A release carries THIRD_PARTY_NOTICES.txt, which tools/notices.py
      # writes from the image's compile units and linker map and from the
      # licence files of the SDK checkout, the fetched SD library and the
      # toolchain. Writing it on every push means code that no component of
      # the script covers, a licence file that moved, or a checkout that is
      # not the pinned commit fails the change that causes it, not the next
      # release. The check then reads the file back against the image.
      - name: Third-party notices
        run: |
          set -eo pipefail
          python3 tools/notices.py --sdk "$HOME/pico-sdk" \
                  --out build/THIRD_PARTY_NOTICES.txt
          python3 tools/notices.py --check build/THIRD_PARTY_NOTICES.txt \
                  --sdk "$HOME/pico-sdk"

      # The pin options are documented build options, so CI passes them. What
      # this proves is the plumbing -- CMake accepts the options and reports
      # what it did. That the value reaches the *firmware* is asserted in the
      # host suite ("Pin overrides reach the descriptor"), which compiles the
      # same descriptor source this build does and is a great deal faster than
      # a firmware build per permutation.
      - name: Pin overrides are plumbed through
        run: |
          set -eo pipefail
          export PICO_SDK_PATH="$HOME/pico-sdk"
          # The pair moves together: the board frees two pins and both defaults
          # are spoken for, so overriding one alone collides and the
          # descriptor's static_assert stops the build -- which is the intended
          # behaviour, not something to test around.
          rm -rf build-pin
          pindefs=(-DDSHOT_PIN_LCD_2_8=28 -DKISS_PIN_LCD_2_8=29)
          # FETCHCONTENT_BASE_DIR points at the main build's _deps so the
          # dependencies fetched (and cached) there are reused instead of
          # being downloaded again.
          cmake -B build-pin -G Ninja -DPICO_BOARD=pico2 \
                -DPICO_PLATFORM=rp2350-arm-s -DCMAKE_BUILD_TYPE=Release \
                -DFETCHCONTENT_BASE_DIR="$PWD/build/_deps" \
                "${pindefs[@]}" . 2>&1 | tee /tmp/cfg.txt
          for a in "${pindefs[@]}"; do
            nv=${a#-D}
            grep -q "Pin override: ${nv%%=*}=GP${nv#*=}" /tmp/cfg.txt \
              || { echo "::error::$a was ignored"; exit 1; }
          done

          # Pin options this build does not take are refused rather than
          # accepted and ignored: the unsuffixed ones and the 2.0" board's.
          for bad in -DDSHOT_PIN=28 -DKISS_PIN=28 -DDSHOT_PIN_LCD_2=4 \
                     -DKISS_PIN_LCD_2=5; do
            rm -rf build-pin
            if cmake -B build-pin -G Ninja -DPICO_BOARD=pico2 \
                     -DPICO_PLATFORM=rp2350-arm-s -DCMAKE_BUILD_TYPE=Release \
                     -DFETCHCONTENT_BASE_DIR="$PWD/build/_deps" \
                     "$bad" . >/dev/null 2>&1; then
              echo "::error::$bad was accepted; it must be refused"
              exit 1
            fi
          done
          echo "pin overrides plumbed; old spellings refused"

      # Run the same validator the release uses, on every push. Releases are
      # rare, so a check that only runs at release time is a check that rots
      # unnoticed between them -- which is exactly how it shipped broken.
      - name: Validate the images
        run: |
          bash test/check_uf2_selftest.sh
          bash test/check_uf2.sh "build/MiniRcBench-$SLUG.uf2"

      # Every green build produces a flashable image, so a change can be tried
      # on hardware without cutting a release first.
      - name: Upload firmware images
        uses: actions/upload-artifact@v7
        with:
          name: MiniRcBench-${{ env.SLUG }}
          # The file inside carries the board too, not only the artifact, so
          # an image names its board after it has left the archive.
          path: |
            build/MiniRcBench-${{ env.SLUG }}.uf2
            build/MiniRcBench-${{ env.SLUG }}.elf
            build/MiniRcBench-${{ env.SLUG }}.elf.map
            build/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  # Runs the firmware's own logic on the host, against stubs. Catches the
  # protocol, codec and UI regressions that a compile alone cannot.
  tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The default target: the device-only sources typechecked, the suite
      # built and run, and the SDIO PIO programs run in test/pio_sdio_emu.py,
      # a cycle-level model, against a card model. The blackbox round-trip it
      # also names skips here with a notice; the blackbox job runs it for
      # real.
      - name: Build and run
        working-directory: test
        run: make
      # The half of the pin-override check that looks at the firmware rather
      # than at CMake's stdout. testPinDefaults() compares the descriptor's
      # defaults against the macros, which is a tautology at the defaults and
      # is not one here: a descriptor that carried literals fails this run and
      # passes every other. @see cfg_pin_defaults
      - name: Pin overrides reach the descriptor
        working-directory: test
        run: |
          make run EXTRA_DEFINES="-DDSHOT_PIN_LCD_2_8=28 -DKISS_PIN_LCD_2_8=29"
      # The KST and Hitec card phases in block reads and writes, from FatFs
      # R0.15 at the SD library's pinned commit over a RAM disk that counts
      # them, against the tables in docs/design/kst-programming.md and
      # docs/design/hitec-programming.md. The cap of the card phase is argued
      # from those tables, so a change to src/kst_files.cpp or
      # src/hitec_files.cpp that moves a count fails here until the table is
      # rewritten.
      - name: KST and Hitec card phases match the design notes
        working-directory: test
        run: make kstcount
      # The wiki is only *published* on release, but its links and its
      # screenshots break on ordinary pushes -- renaming a page, or dropping a
      # fakeDumpFrame() call a manual page happens to show. Catching that here
      # rather than at release time means the failure lands on the commit that
      # caused it. This job is the right home for it because it is the one that
      # has just run the suite, so the screens actually exist to be checked.
      - name: Wiki links and screenshots
        run: |
          python3 tools/make_previews.py --wiki
          python3 tools/check_wiki.py

      - name: Upload rendered frames on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failed-frames
          path: test/*.ppm

  # Line coverage of src/ by the host suite. README.md carries the figure and
  # STATUS.md the table per file, both written by tools/coverage.py. --check
  # fails when either is out of date or when coverage falls below a floor, so
  # drift fails the build instead of being committed by a bot.
  coverage:
    name: Coverage
    # A fixed image, not ubuntu-latest: gcov's line counts follow the GCC
    # (GNU Compiler Collection) version, and the checked-in figure has to match.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Build and run the instrumented suite
        run: make -C test coverage
      - name: Coverage figures are current
        run: python3 tools/coverage.py --check

  # Round-trips a generated log through Betaflight's own decoder. Separate job
  # because it needs blackbox-tools built from source, and because a format
  # regression is a different kind of failure from a logic regression.
  blackbox:
    name: Blackbox round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Only the decoder target. `make` with no target also builds blackbox_render,
      # which needs cairo and freetype -- neither is on the runner, and neither
      # has anything to do with checking a log parses.
      - name: Build blackbox_decode
        run: |
          git clone --depth 1 https://github.com/betaflight/blackbox-tools.git /tmp/bbt
          make -C /tmp/bbt -j"$(nproc)" obj/blackbox_decode
          test -x /tmp/bbt/obj/blackbox_decode
      - name: Encode a log and decode it
        working-directory: test
        run: make bbcheck BBDECODE=/tmp/bbt/obj/blackbox_decode

  # Every build-time option, with warnings fatal: 32 permutations of five
  # switches. They break unnoticed precisely because nobody compiles them by
  # hand -- and on the host the touch driver is compiled only here and by
  # `make syntax`, since the host tests link a fake instead. Syntax-only
  # against the stubs, far quicker than a cross build per combo.
  variants:
    name: Config permutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # LCD_ROTATION is 0 or 2 only: the screen layout is portrait-only and a
      # static_assert in ui.cpp says so. Landscape is excluded here because it
      # is meant to fail, not because it is untested.
      - name: Build each combination with -Werror
        run: |
          set -e
          fail=0
          for tx in 0 1; do
            for jump in 0 1; do
              for rot in 0 2; do
                for kiss in 0 1; do
                  for sd in 0 1; do
                    work=$(mktemp -d)
                    cp -r src "$work/src"
                    sed -i "s/#define AM32_PUSH_PULL_TX      1/#define AM32_PUSH_PULL_TX      $tx/" "$work/src/config.h"
                    sed -i "s/#define AM32_FORCE_LOW_JUMP    0/#define AM32_FORCE_LOW_JUMP    $jump/" "$work/src/config.h"
                    sed -i "s/#define LCD_ROTATION           0/#define LCD_ROTATION           $rot/" "$work/src/config.h"
                    # These substitutions match on exact whitespace. Re-align
                    # one of those lines in config.h and sed matches nothing,
                    # exits 0, and all 32 permutations compile the same default
                    # configuration -- reporting ok 32 times. Assert the value
                    # actually landed rather than trusting the pattern.
                    for want in "AM32_PUSH_PULL_TX      $tx" \
                                "AM32_FORCE_LOW_JUMP    $jump" \
                                "LCD_ROTATION           $rot"; do
                      grep -q "^#define $want\$" "$work/src/config.h" || {
                        echo "::error::sed did not apply '$want' -- has config.h been reformatted?"
                        exit 1
                      }
                    done
                    printf 'TX=%s JUMP=%s ROT=%s KISS=%s SD=%s ... ' \
                      "$tx" "$jump" "$rot" "$kiss" "$sd"
                    # lib/rcbench/ holds rcbench's headers that the servo,
                    # KST and Hitec code includes; none of them reads config.h, so
                    # they are used from the checkout rather than copied.
                    if g++ -std=gnu++17 -fsyntax-only -Wall -Wextra -Wshadow -Werror \
                           -Wno-unused-parameter \
                           -DKISS_TELEM_ENABLE=$kiss -DSD_LOG_ENABLE=$sd \
                           -Itest/stubs -I"$work/src" \
                           -Ilib/rcbench/shared/servo/include \
                           -Ilib/rcbench/shared/outputs/include \
                           -Ilib/rcbench/protocols/kst/include \
                           -Ilib/rcbench/protocols/kst/rp2350 \
                           -Ilib/rcbench/shared/logfile/include \
                           -Ilib/rcbench/protocols/hitec/include \
                           -Ilib/rcbench/protocols/hitec/rp2350 \
                           -Ilib/rcbench/shared/bench/include \
                           -Ilib/rcbench/shared/link/include \
                           "$work"/src/*.cpp; then
                      echo ok
                    else
                      echo FAIL; fail=1
                    fi
                    rm -rf "$work"
                  done
                done
              done
            done
          done

          # And confirm the portrait guard actually refuses landscape, rather
          # than the assert being decorative. Only the guard's own assertion
          # counts: a compile that fails for any other reason, a missing header
          # among them, would pass the check whatever the guard does. Landscape
          # also trips the layout assertions that follow from the panel size.
          work=$(mktemp -d)
          cp -r src "$work/src"
          sed -i "s/#define LCD_ROTATION           0/#define LCD_ROTATION           1/" "$work/src/config.h"
          if g++ -std=gnu++17 -fsyntax-only -Itest/stubs -I"$work/src" \
                 -Ilib/rcbench/shared/servo/include \
                 -Ilib/rcbench/shared/outputs/include \
                 -Ilib/rcbench/protocols/kst/include \
                 -Ilib/rcbench/protocols/kst/rp2350 \
                 -Ilib/rcbench/shared/logfile/include \
                 -Ilib/rcbench/protocols/hitec/include \
                 -Ilib/rcbench/protocols/hitec/rp2350 \
                 -Ilib/rcbench/shared/bench/include \
                 -Ilib/rcbench/shared/link/include \
                 "$work"/src/*.cpp 2>"$work/err.txt"; then
            echo "landscape guard did NOT fire"; fail=1
          elif ! grep -q "static assertion failed: the UI layout assumes portrait" "$work/err.txt"; then
            echo "landscape compile failed for another reason:"; cat "$work/err.txt"; fail=1
          elif grep "error:" "$work/err.txt" | grep -vq "static assertion failed"; then
            echo "landscape compile has errors besides the guard:"; grep "error:" "$work/err.txt"; fail=1
          else
            echo "landscape correctly rejected ... ok"
          fi
          rm -rf "$work"
          exit $fail

  # Both workflow files, parsed and linted on every push. release.yml only runs
  # on v* tags, so nothing checked it between releases -- and it shipped with a
  # duplicate mapping key, which GitHub rejects outright. The first tag push
  # would have started no workflow at all.
  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: actionlint
        run: |
          # Pinned release tarball, verified by checksum -- not a script
          # curl'd from the repo's main branch, which could change under us
          # (or be tampered with) at any time. actionlint v1.7.7, linux/amd64;
          # bump the version and checksum together.
          set -euo pipefail
          version="1.7.7"
          sha256="023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
          curl -sSfL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${version}/actionlint_${version}_linux_amd64.tar.gz"
          echo "${sha256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color
      - name: Reject duplicate keys
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          # PyYAML accepts duplicate mapping keys and silently keeps the last.
          # GitHub does not. This is the check that would have caught it.
          class Strict(yaml.SafeLoader): pass
          def no_dupes(loader, node, deep=False):
              seen, out = set(), {}
              for k, v in node.value:
                  key = loader.construct_object(k, deep=deep)
                  if key in seen:
                      raise ValueError(f"duplicate key {key!r} at {k.start_mark}")
                  seen.add(key)
                  out[key] = loader.construct_object(v, deep=deep)
              return out
          Strict.add_constructor(yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, no_dupes)
          bad = 0
          for f in sorted(glob.glob(".github/workflows/*.yml")):
              try:
                  yaml.load(open(f), Strict)
                  print(f"{f}: ok")
              except Exception as e:
                  print(f"::error::{f}: {e}")
                  bad = 1
          sys.exit(bad)
          EOF

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Precise check: public API documented, @param names matching their
      # signatures, no dangling @ref. Narrower than Doxygen's blunt
      # WARN_IF_UNDOCUMENTED, and correspondingly worth failing on.
      - name: Documentation checks
        run: python3 test/check_docs.py

      - name: Install doxygen
        run: |
          sudo apt-get update && sudo apt-get install -y doxygen graphviz
          # MARKDOWN_ID_STYLE in the Doxyfile needs >= 1.9.8. Older versions
          # warn about the unknown tag, and every warning fails this job, so
          # print the version rather than leaving that as a riddle.
          doxygen --version

      # Any warning left here is structural -- a broken @ref target, a second
      # @mainpage, a missing image -- not a style opinion.
      - name: Generate
        run: |
          set -o pipefail
          doxygen 2>doxygen.log || { echo "doxygen exited non-zero"; cat doxygen.log; exit 1; }
          # Doxygen's own warnings are "<file>:<line>: warning: ...". Counting
          # every line containing the substring instead matched source comments
          # it quotes back -- and board_pins.h, config.h and several others contain
          # @warning blocks, so a perfectly clean run could fail this job.
          count=$(grep -cE '^[^:]*:[0-9]+: *warning:|^ *warning:' doxygen.log || true)
          if [ "${count:-0}" -gt 0 ]; then
            echo "::error::Doxygen reported $count warning(s)"
            head -40 doxygen.log
            exit 1
          fi
          echo "no doxygen warnings"

      - uses: actions/upload-artifact@v7
        with:
          name: api-docs
          path: docs/html

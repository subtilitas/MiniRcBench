name: Release

# Cut a release by pushing a tag:
#
#   git tag -a v0.1.0 -m "MiniRcBench 0.1.0"
#   git push origin v0.1.0
#
# Builds the flashable .uf2 image for the RP2350-Touch-LCD-2.8, writes the
# third-party notices for it, checksums both, and publishes a GitHub Release
# with the image, the notices and the checksums attached. The tag names the
# version in src/version.h, with an optional pre-release suffix: v0.1.0 or
# v0.1.0-rc1 for 0.1.0.

# The run's title carries the tag for both triggers. docs.yml reads it from
# workflow_run.display_title, because a manual run's head_branch is the branch
# it was started from, not the tag.
run-name: Release ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release"
        required: true

env:
  PICO_SDK_VERSION: "2.1.1"

jobs:
  # Resolve the version once so both jobs agree, and so the tag never reaches a
  # shell through ${{ }} interpolation -- a tag containing shell metacharacters
  # would otherwise be executed.
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - id: pick
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_TAG}"
          case "$tag" in
            v*) ;;
            *) echo "::error::'$tag' is not a v-prefixed tag"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "building $tag"

  build:
    name: Build touch-lcd-2.8
    needs: version
    # Pinned for the same reason as CI's firmware job: SDK 2.1.1's pioasm
    # does not build with GCC 15, the host compiler of newer images.
    runs-on: ubuntu-24.04
    env:
      SLUG: touch-lcd-2.8
    steps:
      # ref: is load-bearing for workflow_dispatch. Without it a manual run
      # checks out the branch it was launched from and attaches binaries built
      # from that to a release named after an older tag -- and --verify-tag does
      # not catch it, because the tag does exist. It is the build that is wrong.
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      # The image reports the version in src/version.h over USB and to
      # picotool. A tag that names another version would publish an image whose
      # release name and reported version disagree.
      - name: The tag names the firmware version
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ver=""
          for part in MAJOR MINOR PATCH; do
            n=$(sed -nE "s/^#define FW_VERSION_${part} +([0-9]+).*/\1/p" src/version.h)
            [ -n "$n" ] || { echo "::error::src/version.h defines no FW_VERSION_${part}"; exit 1; }
            ver="${ver:+$ver.}$n"
          done
          case "$TAG" in
            "v$ver"|"v$ver"-*) echo "tag $TAG builds version $ver" ;;
            *) echo "::error::tag $TAG does not name version $ver from src/version.h"; exit 1 ;;
          esac

      - name: Install the ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.3.Rel1"

      - name: Install ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Same key scheme as ci.yml, with restore-keys so a CMakeLists.txt edit
      # reuses the previous entry -- and so release builds share cache entries
      # with CI instead of re-cloning the ~200 MB SDK.
      - uses: actions/cache@v6
        with:
          path: |
            ~/pico-sdk
            build/_deps
          key: picosdk-${{ env.PICO_SDK_VERSION }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            picosdk-${{ env.PICO_SDK_VERSION }}-

      - name: Fetch the Pico SDK
        run: |
          if [ ! -d ~/pico-sdk/.git ]; then
            git clone --depth 1 --branch "$PICO_SDK_VERSION" \
              https://github.com/raspberrypi/pico-sdk.git ~/pico-sdk
            git -C ~/pico-sdk submodule update --init --depth 1 lib/tinyusb
          fi

      # Refuse to build a release from unverified code. The tests are cheap and
      # a broken image carrying a version number is worse than no release.
      - name: Host tests
        working-directory: test
        run: make

      - name: Documentation checks
        run: python3 test/check_docs.py

      - name: Compile
        run: |
          # Set here rather than in env:, because GitHub does not expand ~ in
          # env values -- CMake would receive the literal string "~/pico-sdk"
          # and report the SDK missing.
          export PICO_SDK_PATH="$HOME/pico-sdk"
          # Mirror the CI build exactly: CMAKE_BUILD_TYPE=Release makes the
          # intent explicit, and STRICT=ON applies the same -Werror CI proved
          # the sources clean under -- released bits should be built the way CI
          # tested them.
          cmake -B build -G Ninja -DPICO_BOARD=pico2 -DPICO_PLATFORM=rp2350-arm-s \
                -DCMAKE_BUILD_TYPE=Release -DSTRICT=ON .
          # Named target rather than a bare `ninja`. sdtest is a bench
          # diagnostic and is deliberately not part of a release: an unlabelled
          # second .uf2 beside the firmware is an invitation to flash the wrong
          # one, and it does nothing a user of the tester wants.
          ninja -C build MiniRcBench
          arm-none-eabi-size "build/MiniRcBench-$SLUG.elf"

      # Prove the validator works before trusting its verdict. The first version
      # of this check was inlined here, never executed, and rejected every
      # valid UF2 -- it wanted magic 55463200 instead of 5546320a.
      - name: Self-test the UF2 validator
        run: bash test/check_uf2_selftest.sh

      - name: Name and validate the images
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          mkdir -p dist
          out="dist/MiniRcBench-${TAG}-${SLUG}.uf2"
          cp "build/MiniRcBench-${SLUG}.uf2" "$out"
          bash test/check_uf2.sh "$out"

      # The licences of the code in the image travel with it. tools/notices.py
      # copies each licence text from the files that ship with the code: the
      # SDK checkout above, the SD library in build/_deps, and the license.txt
      # of the toolchain. It fails on code in the image that none of its
      # components covers, and on a checkout that is not the pinned commit;
      # the check then fails on a missing or empty licence section.
      - name: Write and check the third-party notices
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -eo pipefail
          python3 tools/notices.py --sdk "$HOME/pico-sdk" --release "$TAG" \
                  --out dist/THIRD_PARTY_NOTICES.txt
          python3 tools/notices.py --check dist/THIRD_PARTY_NOTICES.txt \
                  --sdk "$HOME/pico-sdk"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ env.SLUG }}
          path: |
            dist/*.uf2
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    # Scoped to the job that needs it. Workflow-scoped, this token was also
    # handed to the build job, which runs third-party actions and clones over
    # the network.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}
          fetch-depth: 0   # generated notes need the history

      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # Again after the transfer, without the build: the file that is about to
      # be published lists its sections, and each has its licence text.
      - name: Check the third-party notices
        run: python3 tools/notices.py --check dist/THIRD_PARTY_NOTICES.txt

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum ./*.uf2 ./THIRD_PARTY_NOTICES.txt > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Which image

          | File | Board |
          |---|---|
          | `MiniRcBench-VERSION-touch-lcd-2.8.uf2` | Waveshare RP2350-Touch-LCD-2.8 |

          The image is for the RP2350-Touch-LCD-2.8 only.

          ## Flashing

          1. Hold **BOOT**, tap **RESET**, release **BOOT**. The board appears as a
             USB (Universal Serial Bus) drive.
          2. Copy the `.uf2` onto it. The board reboots into the new firmware.

          ## Wiring

          Two wires run from the ESC (electronic speed controller):

          | ESC | Board |
          |---|---|
          | Signal | **GP0** — J4 pin 9 or J5 pin 2 |
          | Ground | **GND** — J4 pin 1 or 5, or J5 pin 4 |

          The board brings out two free signal pins, GP0 and GP1. The ESC pin
          is a setting under **MENU → SETTINGS**, kept across power cycles
          after **HOLD TO SAVE**. A wrong pin produces no error: the ESC
          receives no frames. The **LINK** row on the same screen shows the
          live packet rate. A non-zero rate means the pin is correct.

          GP28 (J4 pin 11) and GP29 (J4 pin 12) are not signal pins. Either
          can be the enable of a switched servo supply, under **MENU →
          SETTINGS → SERVO SUPPLY**. Do not wire an ESC to them.

          Cut or depin the middle wire of the ESC lead: it is the BEC (battery
          eliminator circuit) +5 V output, and the board must not be fed
          from it. GP0 and GP1 are fault-tolerant pins: they take up to 5.5 V
          while the board is powered, and with the board off very little
          current flows below 3.63 V.

          ## Optional: KISS telemetry

          A third wire from the ESC's telemetry pad gives 0.01 V and 0.01 A
          steps instead of Extended DShot Telemetry's 0.25 V and 1 A. It lands
          on **GP1**, J4 pin 10 or J5 pin 1. KISS is off by default.
          **MENU → SETTINGS → KISS TELEM** turns it on.

          The level the ESC drives on this line is not measured by this
          project. The KISS specification puts it at 3.6 V. GP1 takes up to
          5.5 V while the board is powered, and with the board off very
          little current flows below 3.63 V.

          ## Licences

          MiniRcBench's own code is MIT. The image also contains the Pico SDK
          (software development kit), TinyUSB, an SD (Secure Digital) card
          library, FatFs, newlib and the GCC (GNU Compiler Collection) runtime
          libraries. `THIRD_PARTY_NOTICES.txt` names each component in the
          image, its version and its files there, with its licence text.

          ## Verify the download

          In the folder that holds the downloaded files:

          ```
          sha256sum -c --ignore-missing SHA256SUMS.txt
          ```

          It checks each file `SHA256SUMS.txt` lists that is in the folder
          against its SHA-256 (Secure Hash Algorithm, 256-bit) checksum and
          skips the listed files that are not there, so a download of the
          image alone checks the image. It fails when no listed file is there.

          ---
          EOF

      # --notes prepends to the generated notes; --notes-file does not combine
      # with --generate-notes, so the body is passed inline.
      # --verify-tag refuses to invent a tag that was never pushed.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "$(cat notes.md)" \
            --generate-notes \
            --verify-tag \
            dist/*.uf2 dist/THIRD_PARTY_NOTICES.txt dist/SHA256SUMS.txt

      - name: Confirm the assets landed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          # Creating a release and attaching assets are separate API calls, so
          # a partially-populated release is a real outcome worth catching.
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          # Full names, fixed-string match, so that no other asset whose name
          # merely contains the board can stand in for the firmware.
          for want in "MiniRcBench-${TAG}-touch-lcd-2.8.uf2" \
                      "THIRD_PARTY_NOTICES.txt" \
                      "SHA256SUMS.txt"; do
            echo "$assets" | grep -qxF "$want" || {
              echo "::error::no asset named '$want' on $TAG"; exit 1; }
          done

          # And nothing unexpected: one image, its notices and the checksums.
          # sdtest is deliberately not released, so a stray diagnostic image
          # beside the firmware fails the run rather than quietly inviting
          # someone to flash it.
          unexpected=$(echo "$assets" \
            | grep -vxF "MiniRcBench-${TAG}-touch-lcd-2.8.uf2" \
            | grep -vxF "THIRD_PARTY_NOTICES.txt" \
            | grep -vxF "SHA256SUMS.txt" || true)
          if [ -n "$unexpected" ]; then
            echo "::error::unexpected assets on $TAG: $unexpected"; exit 1
          fi
          echo "all expected assets present, and only those"

          # What landed is what was checked: the assets match their checksums,
          # and the notices still pass their check.
          landed=$(mktemp -d)
          gh release download "$TAG" --dir "$landed"
          (cd "$landed" && sha256sum -c SHA256SUMS.txt)
          python3 tools/notices.py --check "$landed/THIRD_PARTY_NOTICES.txt"
